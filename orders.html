<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELORA | Order History</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#171717;font-family:Arial,sans-serif}
header{height:80px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}
.logo{font-size:23px;letter-spacing:7px;font-weight:bold}
a{color:#171717;text-decoration:none;font-size:12px;letter-spacing:2px}
main{max-width:850px;margin:75px auto;padding:0 25px}
h1{font-size:34px;letter-spacing:4px;font-weight:400}
.subtitle{color:#777;font-size:13px;margin-bottom:45px}
.order{border:1px solid #e5e5e5;padding:25px;margin-bottom:18px}
.order-top{display:flex;justify-content:space-between;gap:15px}
.order-number{font-weight:bold;font-size:13px}
.status{font-size:10px;letter-spacing:2px;background:#eee;padding:8px 12px}
.total{font-size:14px;margin-top:25px}
.empty{text-align:center;padding:60px 15px;border:1px solid #eee;color:#777;font-size:14px}
button{background:#171717;color:white;border:0;padding:15px 25px;margin-top:25px;cursor:pointer;letter-spacing:2px;font-size:11px}
footer{text-align:center;color:#999;font-size:10px;letter-spacing:3px;padding:50px 10px}
</style>
</head>
<body>

<header>
<div class="logo">VELORA</div>
<a href="index.html">CONTINUE SHOPPING</a>
</header>

<main>
<h1>YOUR ORDERS</h1>
<p class="subtitle">Your recent demo orders.</p>

<div id="orders"></div>
</main>

<footer>V E L O R A</footer>

<script>
const orders = JSON.parse(localStorage.getItem("velora_orders") || "[]");
const container = document.getElementById("orders");

if(orders.length === 0){
container.innerHTML = `
<div class="empty">
You don't have any saved orders yet.
<br>
<a href="index.html"><button>START SHOPPING</button></a>
</div>`;
}else{
container.innerHTML = orders.map(order => `
<div class="order">
<div class="order-top">
<span class="order-number">ORDER #${order.number}</span>
<span class="status">DEMO ORDER</span>
</div>
<div class="total">Order total: $${Number(order.total).toFixed(2)}</div>
</div>
`).join("");
}
</script>

</body>
</html>
